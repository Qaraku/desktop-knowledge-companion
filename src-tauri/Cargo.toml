[package]
name = "desktop_knowledge_companion"
version = "0.1.0"
description = "Local-first desktop knowledge companion"
authors = []
edition = "2021"
rust-version = "1.85"

[lib]
name = "desktop_knowledge_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
