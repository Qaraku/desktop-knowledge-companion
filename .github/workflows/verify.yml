name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
      - run: go test ./...
      - run: sh scripts/verify-core.sh
        shell: bash
      - name: Build Go sidecar
        run: go build -o artifacts/knowledge-core${{ runner.os == 'Windows' && '.exe' || '' }} ./cmd/knowledge-core
      - name: Prepare Tauri sidecar resource
        run: sh scripts/prepare-sidecar.sh
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: knowledge-core-${{ runner.os }}
          path: artifacts/knowledge-core*
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml -q
      - name: Bundle Debian package
        if: runner.os == 'Linux'
        run: npm run tauri -- build --bundles deb
      - name: Bundle Windows installer
        if: runner.os == 'Windows'
        run: npm run tauri -- build --bundles nsis
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: desktop-debian-package
          path: src-tauri/target/release/bundle/deb/*.deb
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: desktop-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
