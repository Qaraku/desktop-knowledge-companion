name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          components: rustfmt
      - run: go test -v ./...
        shell: bash
      - run: sh scripts/verify-core.sh
        shell: bash
      - name: Build Go sidecar
        shell: bash
        run: |
          mkdir -p artifacts
          go build -o artifacts/knowledge-core${{ runner.os == 'Windows' && '.exe' || '' }} ./cmd/knowledge-core
      - name: Prepare Tauri sidecar resource
        run: sh scripts/prepare-sidecar.sh
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: knowledge-core-${{ runner.os }}
          path: artifacts/knowledge-core*
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml -q
      - name: Bundle Linux packages
        if: runner.os == 'Linux'
        run: NO_STRIP=1 npm run tauri -- build --bundles deb,appimage
      - name: Verify Debian package contents
        if: runner.os == 'Linux'
        run: |
          dpkg-deb -c src-tauri/target/release/bundle/deb/*.deb | grep 'usr/bin/knowledge-core'
          package_root=$(mktemp -d)
          trap 'rm -r -- "$package_root"' EXIT
          dpkg-deb -x src-tauri/target/release/bundle/deb/*.deb "$package_root"
          test -f "$package_root/usr/lib/Desktop Knowledge Companion/sidecar-manifest.json"
          "$package_root/usr/bin/knowledge-core" health --data-dir "$package_root/data" --json | grep '"ready":true'
          "$package_root/usr/bin/knowledge-core" health --data-dir "$package_root/data" --json | grep '"schema_version":7'
      - name: Install and smoke test Debian package
        if: runner.os == 'Linux'
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y ./src-tauri/target/release/bundle/deb/*.deb
          test -x /usr/bin/desktop_knowledge_companion
          test -x /usr/bin/knowledge-core
          test -f "/usr/lib/Desktop Knowledge Companion/sidecar-manifest.json"
          knowledge-core health --data-dir /tmp/desktop-knowledge-companion-ci --json | grep '"ready":true,"schema_version":7'
          ! ldd /usr/bin/desktop_knowledge_companion | grep -q 'not found'
          ! ldd /usr/bin/knowledge-core | grep -q 'not found'
      - name: Verify AppImage contents
        if: runner.os == 'Linux'
        run: |
          package_root=$(mktemp -d)
          trap 'rm -r -- "$package_root"' EXIT
          (
            cd "$package_root"
            "$GITHUB_WORKSPACE"/src-tauri/target/release/bundle/appimage/*.AppImage --appimage-extract >/dev/null
          )
          test -x "$package_root/squashfs-root/usr/bin/knowledge-core"
          test -f "$package_root/squashfs-root/usr/lib/Desktop Knowledge Companion/sidecar-manifest.json"
          "$package_root/squashfs-root/usr/bin/knowledge-core" health --data-dir "$package_root/data" --json | grep '"ready":true'
          "$package_root/squashfs-root/usr/bin/knowledge-core" health --data-dir "$package_root/data" --json | grep '"schema_version":7'
      - name: Record Linux package checksums
        if: runner.os == 'Linux'
        run: sha256sum src-tauri/target/release/bundle/deb/*.deb src-tauri/target/release/bundle/appimage/*.AppImage > artifacts/linux-packages.sha256
      - name: Bundle Windows installer
        if: runner.os == 'Windows'
        run: npm run tauri -- build --bundles nsis
      - name: Install and smoke test Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1)
          if ($installer.Count -ne 1) { throw 'expected exactly one NSIS installer' }
          $result = Start-Process -FilePath $installer[0].FullName -ArgumentList '/S' -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw "NSIS installer failed with exit code $($result.ExitCode)" }
          $installRoot = Join-Path $env:LOCALAPPDATA 'Desktop Knowledge Companion'
          $desktop = Join-Path $installRoot 'desktop_knowledge_companion.exe'
          $core = Join-Path $installRoot 'knowledge-core.exe'
          if (!(Test-Path -LiteralPath $desktop -PathType Leaf)) { throw "desktop executable missing: $desktop" }
          if (!(Test-Path -LiteralPath $core -PathType Leaf)) { throw "sidecar missing: $core" }
          $manifests = @(Get-ChildItem -LiteralPath $installRoot -Recurse -Filter sidecar-manifest.json -File)
          if ($manifests.Count -ne 1) { throw "expected one manifest, found $($manifests.Count)" }
          if (!(Select-String -LiteralPath $manifests[0].FullName -Pattern '"schema_version"\s*:\s*7' -Quiet)) { throw 'sidecar manifest schema mismatch' }
          $dataDirectory = Join-Path $env:RUNNER_TEMP 'desktop-knowledge-companion-ci'
          $health = & $core health --data-dir $dataDirectory --json
          if ($LASTEXITCODE -ne 0) { throw "sidecar health failed with exit code $LASTEXITCODE" }
          if ($health -notmatch '"ready":true,"schema_version":7') { throw "unexpected sidecar health: $health" }
      - name: Record Windows installer checksum
        if: runner.os == 'Windows'
        shell: pwsh
        run: Get-FileHash src-tauri/target/release/bundle/nsis/*.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $($_.Path)" } | Set-Content artifacts/windows-installer.sha256
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: desktop-linux-packages
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            artifacts/linux-packages.sha256
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: desktop-windows-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            artifacts/windows-installer.sha256
